<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>分數森林｜數學探險島</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f5fbff;color:#173451}
.wrap{max-width:1080px;margin:auto;padding:16px 18px 60px}
.back{display:inline-block;margin:7px 0 12px;color:#2563eb;font-weight:900;text-decoration:none}
.hero{position:relative;overflow:hidden;border-radius:26px;border:1px solid #dbeafe;box-shadow:0 15px 38px rgba(37,99,235,.10)}
.hero img{width:100%;display:block;aspect-ratio:16/8;object-fit:cover}
.sign{position:absolute;left:18px;top:18px;padding:13px 18px;border:4px solid #5b3418;border-radius:17px;background:linear-gradient(#966037,#76451f);color:#fff7e9;box-shadow:0 10px 26px rgba(60,34,16,.26)}
.sign h1{margin:0;font-size:clamp(28px,5vw,48px)}
.status{margin-top:14px;padding:15px 17px;border-radius:16px;background:#fff8e8;border:1px solid #efd4a2;color:#6f563a;line-height:1.7}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.feature{padding:18px;border-radius:18px;background:white;border:1px solid #dbeafe;box-shadow:0 8px 22px rgba(15,23,42,.05)}
.feature b{display:block;font-size:20px;margin-bottom:6px;color:#3E8A4E}
.feature span{color:#61758a;line-height:1.6}
@media(max-width:700px){.features{grid-template-columns:1fr}.sign{left:10px;top:10px}}
</style>
</head>
<body><div class="wrap">
<a class="back" href="../">← 返回 🧭 數學探險島</a>
<section class="hero">
<img src="../assets/fractions/fraction-forest.webp" alt="分數森林">
<div class="sign"><h1>🍎 分數森林</h1></div>
</section>
<div class="status"><b>準備中</b><br>從蘋果、野餐與整體切分開始，讓孩子先看見「一個整體裡的部分」，再進到等值分數與運算。</div>
<section class="features"><div class="feature"><b>部分與整體</b><span>先理解 1/2、1/3、1/4 真正在表示什麼。</span></div><div class="feature"><b>等值分數</b><span>用圖形與切分看見不同寫法可以同樣大。</span></div><div class="feature"><b>分數運算</b><span>未來加入比較、加減與錯誤診斷。</span></div></section>
</div></body></html>
