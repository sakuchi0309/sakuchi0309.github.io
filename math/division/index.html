<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f5fbff;color:#173451}
.wrap{max-width:1080px;margin:auto;padding:16px 18px 60px}
.back{display:inline-block;margin:7px 0 12px;color:#2563eb;font-weight:900;text-decoration:none}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.feature{padding:18px;border-radius:18px;background:white;border:1px solid #dbeafe;box-shadow:0 8px 22px rgba(15,23,42,.05)}
.feature b{display:block;font-size:20px;margin-bottom:6px;color:#1679B8}
.feature span{color:#61758a;line-height:1.6}
@media(max-width:700px){.features{grid-template-columns:1fr}.sign{left:10px;top:10px}}

</head>
